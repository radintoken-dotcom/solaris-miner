<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solaris Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --accent-color: #f39c12;
            --gold-color: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --text-color: #ffffff;
            --sub-text: #a0a5b1;
            --btn-bg: #222630;
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 15px 0;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--gold-color);
            text-shadow: 0 0 10px var(--gold-glow);
            border-bottom: 1px solid #222;
            background: #12141a;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #282d3c;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 11px;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .big-number {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold-color);
            text-shadow: 0 0 8px var(--gold-glow);
            margin: 8px 0;
        }

        .sub-rate {
            font-size: 12px;
            color: var(--success);
            margin-bottom: 15px;
        }

        .coin-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gold-coin {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #fff7a1, #ffd700 60%, #b8860b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 10px rgba(0,0,0,0.5);
            border: 3px solid #ffe866;
            animation: pulseCoin 2.5s infinite ease-in-out;
        }

        @keyframes pulseCoin {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--gold-glow); }
            50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--gold-glow); }
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
        }

        .btn:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--btn-bg);
            color: #fff;
            border: 1px solid #333;
            box-shadow: none;
        }

        .task-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #282d3c;
        }

        .task-info {
            text-align: left;
            max-width: 60%;
        }

        .task-title {
            font-size: 13px;
            font-weight: bold;
            word-break: break-word;
        }

        .task-reward {
            font-size: 12px;
            color: var(--gold-color);
            margin-top: 3px;
            font-weight: bold;
        }

        .task-btn {
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            background: #229ed9;
            color: #fff;
            box-shadow: none;
        }

        .task-btn.done {
            background: #333;
            color: var(--sub-text);
            cursor: not-allowed;
            font-size: 11px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--sub-text);
            margin-bottom: 5px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #111318;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
