<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChargeGet Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-blue: #00a2e8;
            --bg-gray: #f4f7f9;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #666666;
            --green-color: #28a745;
            --border-color: #e5e9f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: tahoma, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            direction: rtl;
        }

        .header {
            background-color: var(--primary-blue);
            color: #ffffff;
            text-align: center;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Banner & Quick Grid */
        .hero-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }

        .hero-banner img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .quick-item {
            background: #fff;
            padding: 12px 8px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .quick-item img {
            width: 32px;
            height: 32px;
            margin-bottom: 6px;
        }

        /* Card Styles */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .project-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .project-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-info {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-muted);
        }

        .project-info span {
            color: var(--green-color);
            font-weight: bold;
        }

        .project-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

            color: white;
