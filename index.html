<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PulseAd Pro - Ad Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #05070b;
            --card-bg: #0c101d;
            --gold-color: #00ffcc;
            --gold-glow: rgba(0, 255, 204, 0.4);
            --neon-pink: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.4);
            --text-color: #ffffff;
            --sub-text: #8b9bb4;
            --border-color: #1a293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 10%, #111e38 0%, #05070b 80%);
        }

        .header {
            text-align: center;
            padding: 15px 0;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--gold-color);
            text-shadow: 0 0 15px var(--gold-glow);
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 14, 22, 0.95);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 90px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--gold-color);
            box-shadow: 0 0 15px var(--gold-glow), inset 0 0 10px rgba(0, 255, 204, 0.05);
        }

        .card-title {
            font-size: 11px;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .big-number {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            margin: 6px 0;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #0088cc);
            color: #000000;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 0 12px var(--gold-glow);
            letter-spacing: 1px;
        }

        .btn:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-pink {
            background: linear-gradient(135deg, #ff007f, #99004c);
            color: #fff;
            box-shadow: 0 0 12px var(--pink-glow);
        }

        .task-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .task-info {
            text-align: left;
            max-width: 55%;
        }

        .task-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            word-break: break-word;
        }

        .task-reward {
            font-size: 11px;
            color: var(--gold-color);
            margin-top: 4px;
            font-weight: bold;
        }

        .task-btn {
            width: auto;
            padding: 9px 16px;
            font-size: 12px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .task-btn.done {
            background: #1f293d;
            color: var(--sub-text);
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--sub-text);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #05070b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--gold-color);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(10, 14, 22, 0.98);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--sub-text);
            font-size: 10px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-item.active {
            color: var(--gold-color);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="header">⚡ PULSEAD PRO</div>

    <div class="content">
        <!-- 1. CAMPAIGNS / TASKS TAB -->
        <div id="tab-tasks" class="tab-content active">
            <div class="card" style="border-color: var(--neon-pink); box-shadow: 0 0 15px var(--pink-glow);">
                <div class="card-title">YOUR EARNED CREDITS</div>
                <div class="big-number" id="user-balance">0.00 Star</div>
                <div style="font-size: 11px; color: var(--sub-text);">Join channels below to earn rewards & tokens!</div>
            </div>

            <div style="text-align: center; margin-bottom: 12px; font-weight: bold; color: var(--gold-color); font-size: 12px; letter-spacing: 1px;">ACTIVE SPONSOR CHANNELS</div>
            <div id="tasks-container"></div>
        </div>

        <!-- 2. PROMOTE / ADVERTISE TAB -->
        <div id="tab-promote" class="tab-content">
            <div class="card" style="text-align: left;">
                <div class="card-title" style="text-align: center; color: var(--gold-color); font-size: 13px; margin-bottom: 12px;">📢 CREATE AD CAMPAIGN</div>
                
                <div class="input-group">
                    <label>Channel / Bot Username or Link</label>
                    <input type="text" id="ad-link" class="input-field" placeholder="https://t.me/your_channel">
                </div>

                <div class="input-group">
                    <label>Required Members / Views</label>
                    <input type="number" id="ad-count" class="input-field" placeholder="100">
                </div>

                <div class="input-group">
                    <label>Reward per user (Stars / TON)</label>
                    <input type="number" id="ad-reward" class="input-field" value="0.5" step="0.1">
                </div>

                <button class="btn btn-pink" onclick="submitCampaign()">LAUNCH CAMPAIGN</button>
            </div>
        </div>

        <!-- 3. EARN / REFERRAL TAB -->
        <div id="tab-earn" class="tab-content">
            <div class="card">
                <div class="card-title">YOUR REFERRAL LINK</div>
                <input type="text" class="input-field" id="ref-link" readonly style="text-align: center; margin: 10px 0; color: var(--gold-color); font-weight: bold;">
                <button class="btn" onclick="copyRefLink()">COPY INVITE LINK</button>
            </div>

            <div class="card">
                <div class="card-title">TOTAL REFERRED USERS</div>
                <div class="big-number" id="ref-count">0</div>
                <div style="font-size: 11px; color: var(--gold-color);">Earn 10% from your friends' activities!</div>
            </div>
        </div>

        <!-- 4. WALLET / PROFILE TAB -->
        <div id="tab-wallet" class="tab-content">
            <div class="card">
                <div class="card-title">MY WALLET BALANCE</div>
                <div class="big-number"><span id="wallet-balance">0.00</span> Star</div>
            </div>

            <div class="card" style="text-align: left;">
                <div class="input-group">
                    <label>Withdraw to Tonkeeper / Telegram Wallet</label>
                    <input type="text" id="payout-addr" class="input-field" placeholder="UQ... or TON address">
                </div>
                <button class="btn" onclick="requestPayout()">REQUEST WITHDRAWAL</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV BAR -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('tasks', this)">
            <div class="nav-icon">🎯</div>
            <div>TASKS</div>
        </div>
        <div class="nav-item" onclick="switchTab('promote', this)">
            <div class="nav-icon">📢</div>
            <div>PROMOTE</div>
        </div>
        <div class="nav-item" onclick="switchTab('earn', this)">
            <div class="nav-icon">🔗</div>
            <div>INVITE</div>
        </div>
        <div class="nav-item" onclick="switchTab('wallet', this)">
            <div class="nav-icon">💎</div>
            <div>WALLET</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'user_' + Math.floor(100000 + Math.random() * 900000);
        let balance = parseFloat(localStorage.getItem('pulse_bal_' + userId) || '2.50');
        let referrals = parseInt(localStorage.getItem('pulse_refs_' + userId) || '0');

        // لیست کانال‌ها و تبلیغات سفارشی که برای ممبرگیری ثبت شده‌اند
        let tasks = JSON.parse(localStorage.getItem('pulse_tasks') || JSON.stringify([
            { id: 1, title: "Crypto Whale Channel", reward: 0.5, link: "https://t.me/trancemusicpsy" },
            { id: 2, title: "TON Airdrop Hub", reward: 0.5, link: "https://t.me/lifetime_energy_bot" },
            { id: 3, title: "Metaverse Gaming News", reward: 1.0, link: "https://g.cb.click/aVYJfp" }
        ]));

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2) + ' Star';
            document.getElementById('wallet-balance').innerText = balance.toFixed(2);
            document.getElementById('ref-count').innerText = referrals;
            document.getElementById('ref-link').value = `https://t.me/PulseAdProBot?start=${userId}`;
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            if (el) el.classList.add('active');
            
            if(tabName === 'tasks') {
                renderTasks();
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            
            const now = new Date().getTime();

            tasks.forEach(task => {
                const expireKey = 'pulse_task_' + userId + '_' + task.id;
                const expireTime = localStorage.getItem(expireKey);
                const timeLeft = expireTime ? parseInt(expireTime) - now : 0;
                const isDone = expireTime && timeLeft > 0;
                
                const div = document.createElement('div');
                div.className = 'task-item';
                
                let btnHtml = '';
                if (!isDone) {
                    btnHtml = `<button class="task-btn" onclick="doTask(${task.id}, '${task.link}', ${task.reward})">Join (+${task.reward})</button>`;
                } else {
                    btnHtml = `<button class="task-btn done" disabled>Completed</button>`;
                }

                div.innerHTML = `
                    <div class="task-info">
                        <div class="task-title">${task.title}</div>
                        <div class="task-reward">Reward: +${task.reward} Stars</div>
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(div);
            });
        }

        function doTask(id, link, reward) {
            tg.openTelegramLink(link);
            
            setTimeout(() => {
                balance += reward;
                localStorage.setItem('pulse_bal_' + userId, balance);
                
                // قفل کردن تسک برای ۲۴ ساعت
                const nextAvailable = new Date().getTime() + (24 * 60 * 60 * 1000);
                localStorage.setItem('pulse_task_' + userId + '_' + id, nextAvailable);

                renderTasks();
                updateUI();
                tg.showAlert(`🎉 Success! +${reward} Stars added to your balance.`);
            }, 4000);
        }

        function submitCampaign() {
            const link = document.getElementById('ad-link').value.trim();
            const count = parseInt(document.getElementById('ad-count').value);
            const reward = parseFloat(document.getElementById('ad-reward').value);

            if (!link || !count || isNaN(reward)) {
                tg.showAlert("❌ Please fill out all campaign fields correctly.");
                return;
            }

            const newTask = {
                id: tasks.length + 1,
                title: "Sponsored: " + link.replace('https://t.me/', '@'),
                reward: reward,
                link: link
            };

            tasks.unshift(newTask);
            localStorage.setItem('pulse_tasks', JSON.stringify(tasks));

            tg.showAlert("🚀 Campaign successfully launched and added to active tasks!");
            document.getElementById('ad-link').value = '';
            document.getElementById('ad-count').value = '';
            switchTab('tasks', document.querySelector('.nav-item'));
        }

        function copyRefLink() {
            const copyText = document.getElementById("ref-link");
            copyText.select();
            document.execCommand("copy");
            tg.showAlert("📋 Referral link copied to clipboard!");
        }

        function requestPayout() {
            const addr = document.getElementById('payout-addr').value.trim();
            if (!addr || addr.length < 5) {
                tg.showAlert("❌ Please enter a valid wallet address.");
                return;
            }
            if (balance < 5.0) {
                tg.showAlert("❌ Minimum withdrawal is 5.0 Stars.");
                return;
            }

            balance -= 5.0;
            localStorage.setItem('pulse_bal_' + userId, balance);
            updateUI();
            tg.showAlert("✅ Withdrawal request submitted! Processing within 24h.");
            document.getElementById('payout-addr').value = '';
        }

        updateUI();
        renderTasks();
    </script>
</body>
</html>
